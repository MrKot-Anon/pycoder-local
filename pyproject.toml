[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycoder-local"
version = "0.6.5"
description = "Standalone coding agent with Codex-derived algorithms and a single configurable model endpoint"
requires-python = ">=3.11"
dependencies = ["textual==8.2.8"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
e2ee = ["chutes-e2ee==0.1.0", "pqcrypto==0.3.4", "cryptography==43.0.1",
        "dcap-qvl==0.6.5", "nv-attestation-sdk==2.7.3"]

[project.scripts]
pycoder = "pycoder.cli:main"

[tool.setuptools.packages.find]
include = ["pycoder*"]

[tool.setuptools.package-data]
pycoder = ["instructions/*.md", "instructions/*.lark", "instructions/*.sbpl"]
